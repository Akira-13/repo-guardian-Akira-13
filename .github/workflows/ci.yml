name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: ruff check src tests 
      - name: Run tests (skip coverage if no code)
        run: |
          if [ -n "$(find guardian -name '*.py')" ]; then
            pytest -n auto --cov=guardian
          else
            echo "No code yet — skipping coverage check."
          fi
      - name: Run behave (skip if no features)
        run: |
          if find . -name '*.feature' | grep -q .; then
            behave -f progress
          else
            echo "No .feature files found — skipping behave tests."
          fi
